[project]
name = "mvevirag"
version = "0.2.0"
description = "Multi-view evidence sufficiency Video RAG with pre-generation completeness gate."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.45",
    "timm>=1.0",
    "opencv-python-headless>=4.9",
    "pillow>=10",
    "imageio[ffmpeg]>=2.34",
    "av>=12",
    "numpy>=1.26",
    "psutil>=5.9",
    "cvxpy>=1.5",
    "faiss-cpu>=1.7",
    "pydantic>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
gpu = [
    "vllm>=0.6",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
norecursedirs = ["scripts"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # long lines: tables/report strings are clearer unwrapped
    "SIM108", # ternary rewrites can hurt audit-code readability
    "B023",   # loop-var closures are used immediately in writer loops
]

[tool.ruff.lint.isort]
known-first-party = ["mvevirag"]
